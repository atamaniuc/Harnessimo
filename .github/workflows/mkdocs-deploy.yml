name: Deploy MkDocs to GitHub Pages

# Builds docs/ strictly and deploys it through the official Pages pipeline.
#
# The history of this file is the lesson it encodes:
#
#   * `mkdocs build` without --strict shipped three pages unreachable from nav
#     and nine mermaid diagrams rendered as source text, silently. It is strict
#     now.
#   * A gh-pages branch push reported success while the site served 404,
#     because Pages was off. Turning it on from here was refused — the Actions
#     token may not create a Pages site — so it stayed a human action.
#   * Once enabled with "GitHub Actions" as the source, a branch push is
#     ignored entirely: the site only updates through deploy-pages. Hence this.
#
# The last step fetches the URL and writes the verdict into the job summary,
# because publishing and serving are different facts and this file has now been
# wrong about that twice.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
      - run: pip install -r requirements.txt
      # Fails on a link that no longer resolves, or a page in docs/ that
      # nothing in nav points at.
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Checking the root URL is not enough, and this step learned that the
      # hard way: with Pages set to serve a branch, GitHub's own Jekyll renders
      # README.md at the root and answers 200 while none of this site is
      # published. So the check asks for a page only MkDocs produces, and for
      # the diagram markup only the mermaid fence produces.
      - name: Report whether THIS site is the one being served
        run: |
          URL="${{ steps.deployment.outputs.page_url }}"
          sleep 15
          PAGE="${URL%/}/STANDARD/"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' -L "$PAGE" || echo 000)"
          DIAGRAMS="$(curl -s -L "$PAGE" | grep -c 'class="mermaid"' || echo 0)"
          if [ "$CODE" = "200" ] && [ "$DIAGRAMS" -ge 1 ]; then
            echo "### Docs are live with $DIAGRAMS rendered diagram(s): $URL" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Deployed, but the served site is not this one"
              echo
              echo "\`${PAGE}\` answered **$CODE** with **$DIAGRAMS** mermaid block(s)."
              echo "A MkDocs page would answer 200 and carry the diagrams."
              echo
              echo "The usual cause: **Settings → Pages → Source** is set to a branch, so"
              echo "GitHub's Jekyll renders the repository's Markdown instead of this build."
              echo "Set the source to **GitHub Actions** and the next run publishes this site."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
