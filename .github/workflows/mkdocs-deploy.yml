name: Deploy MkDocs to GitHub Pages

# Publishes docs/ to GitHub Pages through the official Pages pipeline rather
# than a third-party branch push. Two reasons it was rewritten:
#
#   * The previous version deployed to a gh-pages branch and reported success
#     while the site served 404, because Pages itself was never switched on in
#     the repository settings. `configure-pages` with `enablement: true` turns
#     it on from here, so a green run and a working site are the same thing.
#   * `mkdocs build` ran without --strict, so a broken link or a page missing
#     from nav shipped silently. It is strict now; the build is clean under it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run supersedes an older one rather than
# racing it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
      - run: pip install -r requirements.txt
      # --strict turns a warning into a failed build: a link that no longer
      # resolves, or a page that exists in docs/ and is unreachable from nav.
      - run: mkdocs build --strict
      - uses: actions/configure-pages@v5
        with:
          # Switches Pages on if it is off. Without this the deploy succeeds
          # and the site 404s, which is the exact failure this file had.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
