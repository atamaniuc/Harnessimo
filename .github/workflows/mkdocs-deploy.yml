name: Deploy MkDocs to GitHub Pages

# Builds docs/ strictly and publishes it to the gh-pages branch.
#
# Two things this file learned the hard way:
#
#   * `mkdocs build` without --strict shipped three pages that were unreachable
#     from nav and nine mermaid diagrams rendered as source text, without a word
#     of complaint. It is strict now.
#   * A green deploy is not a live site. The first version pushed gh-pages,
#     reported success, and the URL served 404 because Pages had never been
#     switched on. Switching it on from here was tried and refused: the Actions
#     token cannot create a Pages site in this repository ("Resource not
#     accessible by integration"), so it stays a human action — and the last
#     step below states plainly whether the site actually answers, rather than
#     letting a green tick imply it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip

      - run: pip install -r requirements.txt

      # --strict fails on a link that no longer resolves, or a page in docs/
      # that nothing in nav points at.
      - name: Build the site
        run: mkdocs build --strict

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site

      # Publishing and serving are two different facts, and conflating them is
      # how a site 404s behind a green badge for a day. This reports which one
      # is true; it does not fail the run, because the missing switch is not
      # something this workflow is allowed to flip.
      - name: Report whether the site actually serves
        run: |
          URL="https://atamaniuc.github.io/Harnessimo/"
          sleep 20
          CODE="$(curl -s -o /dev/null -w '%{http_code}' -L "$URL" || echo 000)"
          if [ "$CODE" = "200" ]; then
            echo "### Docs are live: $URL" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### The site is built and published, and does not serve (HTTP $CODE)"
              echo
              echo "GitHub Pages is not enabled for this repository. The Actions token is not"
              echo "permitted to enable it, so this is one manual switch:"
              echo
              echo "**Settings → Pages → Build and deployment → Source: _Deploy from a branch_ →"
              echo "\`gh-pages\` / \`/ (root)\`**"
              echo
              echo "Nothing links to $URL until it answers."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
