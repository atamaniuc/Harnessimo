name: Deploy MkDocs to GitHub Pages

# Builds docs/ strictly and deploys it through the official Pages pipeline.
#
# The history of this file is the lesson it encodes:
#
#   * `mkdocs build` without --strict shipped three pages unreachable from nav
#     and nine mermaid diagrams rendered as source text, silently. It is strict
#     now.
#   * A gh-pages branch push reported success while the site served 404,
#     because Pages was off. Turning it on from here was refused — the Actions
#     token may not create a Pages site — so it stayed a human action.
#   * Once enabled with "GitHub Actions" as the source, a branch push is
#     ignored entirely: the site only updates through deploy-pages. Hence this.
#
# The last step fetches the URL and writes the verdict into the job summary,
# because publishing and serving are different facts and this file has now been
# wrong about that twice.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
      - run: pip install -r requirements.txt
      # Fails on a link that no longer resolves, or a page in docs/ that
      # nothing in nav points at.
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Report whether the site actually serves
        run: |
          URL="${{ steps.deployment.outputs.page_url }}"
          sleep 15
          CODE="$(curl -s -o /dev/null -w '%{http_code}' -L "$URL" || echo 000)"
          if [ "$CODE" = "200" ]; then
            echo "### Docs are live: $URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Deployed, and the URL answers $CODE — $URL" >> "$GITHUB_STEP_SUMMARY"
            echo "Publishing and serving are different facts; this one is the second." >> "$GITHUB_STEP_SUMMARY"
          fi
