name: Publish to npm

# Publishes the package on a release, and on demand.
#
# Authentication is trusted publishing: npm verifies a short-lived OIDC token
# this workflow gets from GitHub, matched against a publisher configured on the
# package itself (npmjs.com → harnessimo → Settings → Trusted Publisher →
# GitHub Actions, atamaniuc/Harnessimo, publish.yml).
#
# There is deliberately no token here. A stored npm token is a credential that
# outlives the job it was made for, works from anywhere, and is one leaked log
# away from someone else publishing as you. The OIDC token is minted per run,
# scoped to this repository and this workflow file, and expires in minutes.
#
# Which also means: renaming this file, or moving the publish into another
# workflow, breaks publishing until the trusted publisher is updated to match.
# That is the trade, and it is the right way round — the name is part of the
# credential.

# Publishing requires a release to exist — checked here rather than implied by
# the trigger, which is a lesson this file learned the hard way.
#
# The first attempt was `on: release` alone, after three versions reached npm
# through a manual run while the repository's tags stopped two releases behind.
# That looked airtight and published nothing: a release created by a workflow
# using GITHUB_TOKEN does not raise events, by GitHub's loop-prevention rule, so
# the trigger never fired. A trigger that cannot fire is not a guarantee, it is
# a silence.
#
# So the manual trigger is back and the invariant is enforced directly: this
# refuses to publish a version that has no matching GitHub release. npm cannot
# get ahead of the history, and the reason it cannot is a step someone can read.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # The OIDC token trusted publishing verifies, and what signs provenance.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs a newer npm than Node 22 ships with (10.x).
      # Pinned to the major so a broken patch cannot take publishing down.
      - run: npm install -g npm@^11
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # The same gate CI runs, against the built package, so a publish cannot
      # ship something the checks never saw.
      - run: node dist/cli.js check
      # No NODE_AUTH_TOKEN: the OIDC exchange is the authentication, and
      # provenance is signed with the same identity.
      # A release cut for a version that is already on the registry — which is
      # what fixing the missed tags does — would otherwise fail the run for a
      # state that is already correct.
      - name: Does a release exist for this version?
        uses: actions/github-script@v7
        with:
          script: |
            const version = require("./package.json").version;
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag: `v${version}` });
              core.info(`v${version} is released; publishing it`);
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setFailed(
                `no v${version} release: cut one first, so the registry cannot lead the repository`,
              );
            }

      - name: Is this version already published?
        id: published
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "harnessimo@$VERSION" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "harnessimo@$VERSION is already on the registry; nothing to publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.skip == 'false'
        run: npm publish --provenance --access public
