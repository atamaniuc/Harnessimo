name: Publish to npm

# The install line the documentation should have: `npm i -D harnessimo@0.4.1`,
# working in every package manager with no tarball URL and no git dependency.
#
# It runs on a published release and skips itself when NPM_TOKEN is absent, so
# arming it is one action by a person who owns the npm account:
#
#   1. create an automation token on npmjs.com
#   2. add it as the repository secret NPM_TOKEN
#
# Nothing else changes: the same build, the same package, the same version.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Is this armed?
        id: armed
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN is not set: skipping the publish rather than failing the release." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.armed.outputs.armed == 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.armed.outputs.armed == 'true'
        run: npm run build
      # The same gate the release ran, against the built package, so a publish
      # cannot ship something the checks never saw.
      - if: steps.armed.outputs.armed == 'true'
        run: node dist/cli.js check
      - if: steps.armed.outputs.armed == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
