name: Publish to npm

# Publishes the package on a release, and on demand.
#
# Authentication is moving to trusted publishing: npm verifies a short-lived
# OIDC token this workflow gets from GitHub, so nothing long-lived is stored
# anywhere. It is configured on the package, not here — npmjs.com → harnessimo
# → Settings → Trusted Publisher → GitHub Actions, repository
# atamaniuc/Harnessimo, workflow publish.yml.
#
# Until that is in place NODE_AUTH_TOKEN is kept as a fallback: the npm CLI
# prefers OIDC when a trusted publisher matches and falls back to the token
# otherwise, so both work and neither has to be timed against the other. Once a
# publish has succeeded through OIDC, the token step and the NPM_TOKEN secret
# both go — that is the whole point of the exercise.
#
# The token that is there must be an *automation* token. An ordinary one fails
# with EOTP: this account requires a second factor for writes, and CI has no
# authenticator.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # The OIDC token trusted publishing verifies, and what signs provenance.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs a newer npm than Node 22 ships with (10.x).
      # Pinned to the major so a broken patch cannot take publishing down.
      - run: npm install -g npm@^11
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # The same gate CI runs, against the built package, so a publish cannot
      # ship something the checks never saw.
      - run: node dist/cli.js check
      - run: npm publish --provenance --access public
        env:
          # Ignored once trusted publishing is configured; removed with the
          # secret when that is confirmed.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
