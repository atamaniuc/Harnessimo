name: CI

# Every job runs the same commands a developer runs. There is no CI-only
# script, so there is no "works locally, fails in CI".
#
#   check       the rules and the wiring, on every supported Node version,
#               run straight from the TypeScript sources through Node's own
#               type stripping — no install, no build
#   typecheck   tsc over everything, strict: the types are the contract, and a
#               test suite does not check them
#   build       the compiled package works, not just the sources: it builds,
#               it packs, and the CLI runs from what a consumer would install
#   self-host   this repository's own gates, including re-verification of
#               every queue claim — a state edited by hand fails here
#   session-hygiene  an agent commit did not touch the files defining success,
#               and the session left no debris behind
#   cold-start  a fresh clone runs from the repository alone

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: tests on node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in package.json, and current. A rule that only
        # works on the version the author happens to run is not portable, and
        # consumers install this into their own toolchain.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # No install step: the package has no runtime dependencies, by rule, and
      # Node runs the TypeScript sources directly. If this line ever needs
      # `npm ci`, CONSTRAINTS #1 was broken.
      - run: npm test

  typecheck:
    name: the types check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The jobs that install anything install only devDependencies:
      # typescript and @types/node. Nothing ships with the package —
      # CONSTRAINTS #1 is about runtime dependencies, and `dependencies` is
      # still absent.
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  build:
    name: the compiled package runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # What a consumer actually gets: the compiled CLI, from a packed tarball,
      # checking this repository. A build that emits files nobody runs is not
      # evidence of anything.
      - run: node dist/cli.js check
      - name: The tarball installs and runs
        run: |
          npm pack --silent
          mkdir -p "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm i --no-audit --no-fund "$GITHUB_WORKSPACE"/harnessimo-*.tgz
          npx harnessimo help
          node --input-type=module -e "import { checkTarget } from 'harnessimo'; if (typeof checkTarget !== 'function') process.exit(1)"

  self-host:
    name: the harness on itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The release check reads git tags, and a shallow checkout has none.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # --reverify re-runs every item claiming to pass, so a hand-edited state
      # is caught rather than trusted. This is the check that makes the queue's
      # evidence evidence.
      - run: node src/cli.ts check --reverify
      - run: node src/cli.ts doctor

  session-hygiene:
    name: locked surfaces and clean exit
    # Both checks read a commit range rather than a snapshot: they judge what
    # this change did, not what the repository looks like.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the check walks commits, and a two-commit clone makes
          # the range unresolvable. The tool skips with a stated reason rather
          # than passing silently, but skipping is not the point of the job.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: An agent commit may not touch the files that define success
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          node src/cli.ts locked "$BASE" HEAD
      # Lecture 12: the debris a build compiles happily, and a progress file
      # that went stale while the code around it changed.
      - name: The session left a clean state
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          node src/cli.ts clean-exit "$BASE" HEAD

  cold-start:
    name: a fresh clone verifies itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node src/cli.ts cold-start
