site_name: Harnessimo
site_description: The arbiter that lets an agent run unattended — eight checks that decide when work is finished.
site_url: https://atamaniuc.github.io/Harnessimo/
repo_url: https://github.com/atamaniuc/Harnessimo
repo_name: atamaniuc/Harnessimo
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Guide (15 min): GUIDE.md
  - Гайд (15 минут): GUIDE.ru.md
  - The standard: STANDARD.md
  - Adopting an existing repo: ADOPTING.md
  - Contributing: https://github.com/atamaniuc/Harnessimo/blob/main/CONTRIBUTING.md

theme:
  name: material
  features:
    - navigation.instant
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Switch to light mode }

plugins:
  - search
  - mermaid2

markdown_extensions:
  - admonition
  - def_list
  - tables
  - attr_list
  # Without the custom fence, every ```mermaid block renders as a code listing
  # rather than a diagram — which is how the first build shipped: seven
  # diagrams, all of them printed as text.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
