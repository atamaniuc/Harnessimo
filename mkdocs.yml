site_name: Harnessimo
# Quoted: the colon would otherwise end the key, and mkdocs fails to parse.
site_description: "Spec-driven development and the harness that makes it stick: nine checks that decide when a lane is finished."
site_url: https://atamaniuc.github.io/Harnessimo/
repo_url: https://github.com/atamaniuc/Harnessimo
repo_name: atamaniuc/Harnessimo
# Points the page's source action at the rendered file on GitHub rather than
# the editor: a reader following it wants to read the Markdown, and GitHub's
# own Edit button is right there for anyone who wants to change it.
edit_uri: blob/main/docs/

nav:
  - Home: index.md
  - Why this exists: WHY.md
  - Guide (15 min): GUIDE.md
  - Configuration: CONFIGURATION.md
  - Reference: REFERENCE.md
  - More than one agent: PARALLEL.md
  - SDD — what was taken from OpenSpec, Spec Kit, BMAD: SDD.md
  - The standard: STANDARD.md
  - FAQ: FAQ.md
  - Troubleshooting: TROUBLESHOOTING.md
  - Contributing: https://github.com/atamaniuc/Harnessimo/blob/main/CONTRIBUTING.md

theme:
  name: material
  features:
    # navigation.instant is deliberately absent: it breaks the language
    # switcher's contextual link, which matters more than the transition.
    - navigation.top
    - content.code.copy
    # Every page links back to its source: "view" opens the Markdown on GitHub,
    # "edit" opens it ready to change. A documentation site with no way back to
    # the file it was built from invites a fix to be written twice.
    - content.action.edit
    # One choice of package manager, remembered across every tabbed block and
    # every page: picking npm once should not have to be repeated per snippet.
    - content.tabs.link
  icon:
    # The action is "read the source", so the icon says GitHub, not a pencil.
    edit: material/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Switch to light mode }

plugins:
  # Language first: it rewrites the page tree the others then see.
  #
  # Suffix scheme — GUIDE.md is English, GUIDE.ru.md is its translation. The
  # English site stays at the root so every link ever published keeps working,
  # and Russian is served under /ru/. Adding a language later is one entry here
  # plus the files; nothing else in this repository knows how many there are.
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ru
          name: Русский
          build: true
          nav_translations:
            Home: Главная
            Why this exists: Зачем это
            Guide (15 min): Гайд (15 минут)
            Configuration: Конфигурация
            Reference: Справочник
            SDD — what was taken from OpenSpec, Spec Kit, BMAD: SDD — что взято из OpenSpec, Spec Kit, BMAD
            The standard: Стандарт
            FAQ: FAQ
            Troubleshooting: Что делать, когда сломалось
            Contributing: Как участвовать
  - search
  - mermaid2
  # A page that moves takes its published links with it unless something
  # catches them. Every retired page keeps answering, pointed at whatever
  # absorbed it, and test/docs-structure.test.ts fails when a target here is
  # not a page that exists.
  - redirects:
      redirect_maps:
        ADOPTING.md: GUIDE.md
        ADOPTING.ru.md: GUIDE.ru.md
        USE-CASES.md: REFERENCE.md
        USE-CASES.ru.md: REFERENCE.ru.md

hooks:
  # mkdocs-redirects builds for one page tree; the site has one per language.
  - hooks/i18n_redirects.py

markdown_extensions:
  - admonition
  # Package-manager tabs (pnpm / npm / yarn / bun) on every install and run
  # example. Without alternate_style the tabs render as plain headings.
  - pymdownx.tabbed:
      alternate_style: true
  - def_list
  - tables
  - attr_list
  # Without the custom fence, every ```mermaid block renders as a code listing
  # rather than a diagram — which is how the first build shipped: seven
  # diagrams, all of them printed as text.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
