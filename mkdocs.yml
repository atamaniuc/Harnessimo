site_name: Harnessimo
site_description: Eight checks that stop an AI coding agent from calling unfinished work done.
site_url: https://atamaniuc.github.io/Harnessimo/
repo_url: https://github.com/atamaniuc/Harnessimo
repo_name: atamaniuc/Harnessimo
# Points the page's source action at the rendered file on GitHub rather than
# the editor: a reader following it wants to read the Markdown, and GitHub's
# own Edit button is right there for anyone who wants to change it.
edit_uri: blob/main/docs/

nav:
  - Home: index.md
  - Guide (15 min): GUIDE.md
  - Гайд (15 минут): GUIDE.ru.md
  - Use cases: USE-CASES.md
  - SDD, HDD, BMAD: METHODS.md
  - The standard: STANDARD.md
  - Adopting an existing repo: ADOPTING.md
  - Contributing: https://github.com/atamaniuc/Harnessimo/blob/main/CONTRIBUTING.md

theme:
  name: material
  features:
    - navigation.instant
    - navigation.top
    - content.code.copy
    # Every page links back to its source: "view" opens the Markdown on GitHub,
    # "edit" opens it ready to change. A documentation site with no way back to
    # the file it was built from invites a fix to be written twice.
    - content.action.edit
  icon:
    # The action is "read the source", so the icon says GitHub, not a pencil.
    edit: material/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Switch to light mode }

plugins:
  - search
  - mermaid2

markdown_extensions:
  - admonition
  - def_list
  - tables
  - attr_list
  # Without the custom fence, every ```mermaid block renders as a code listing
  # rather than a diagram — which is how the first build shipped: seven
  # diagrams, all of them printed as text.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
