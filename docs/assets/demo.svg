  </style>
  <rect width="860" height="545" rx="10" fill="#14171c"/>
  <circle cx="24" cy="22" r="5" fill="#f87171"/>
  <circle cx="42" cy="22" r="5" fill="#fbbf24"/>
  <circle cx="60" cy="22" r="5" fill="#4ade80"/>
  <text x="430" y="26" text-anchor="middle" class="comment">harnessimo</text>
    <text x="22" y="66" class="prompt"><tspan class="sigil">$ </tspan>harnessimo init</text>
    <text x="22" y="85" class="out">harnessimo init: wrote 16 file(s)</text>
