    <text x="22" y="142" class="out">  + .harness/5-feedback/README.md</text>
    <text x="22" y="161" class="comment">  … 28 more lines</text>
    <text x="22" y="180" class="out"></text>
    <text x="22" y="199" class="prompt"><tspan class="sigil">$ </tspan>harnessimo check</text>
    <text x="22" y="218" class="good">  ok    proof markers  2 proof marker(s) across 14 document(s) all resolve</text>
    <text x="22" y="237" class="good">  ok    work tracks    0 live track(s) in specs/TRACKS.md resolve and carry a status</text>
    <text x="22" y="256" class="good">  ok    task gate      checked boxes in 0 live task list(s) name a passing check</text>
    <text x="22" y="275" class="good">  ok    queue          queue invariants hold</text>
    <text x="22" y="294" class="good">harnessimo: every configured check passes.</text>
    <text x="22" y="313" class="out"></text>
    <text x="22" y="332" class="comment"># someone renames the function the README points at</text>
    <text x="22" y="351" class="out"></text>
    <text x="22" y="370" class="prompt"><tspan class="sigil">$ </tspan>harnessimo check</text>
    <text x="22" y="389" class="good">  ok    work tracks    0 live track(s) in specs/TRACKS.md resolve and carry a status</text>
    <text x="22" y="408" class="good">  ok    task gate      checked boxes in 0 live task list(s) name a passing check</text>
    <text x="22" y="427" class="good">  ok    queue          queue invariants hold</text>
    <text x="22" y="446" class="bad">  FAIL  proof markers</text>
    <text x="22" y="465" class="out">    README.md:3  src/totals.ts:orderTotal</text>
    <text x="22" y="484" class="out">        "src/totals.ts" does not contain "orderTotal"</text>
    <text x="22" y="503" class="bad">harnessimo: 1 problem(s).</text>
